name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - '.github/workflows/release.yml'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build daemon (x64)
        run: bun build src/index.ts --compile --outfile build/extra-type-x64

      - name: Install native build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc pkg-config libgtk-4-dev libgtk4-layer-shell-dev libpipewire-0.3-dev libsoup-3.0-dev libjson-glib-dev

      - name: Build viz (x64)
        run: |
          make viz
          mv build/extra-type-viz build/extra-type-viz-x64
          mv build/extra-type-settings build/extra-type-settings-x64

      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          mkdir -p release-x64
          cp build/extra-type-x64 release-x64/extra-type
          cp build/extra-type-viz-x64 release-x64/extra-type-viz
          cp build/extra-type-settings-x64 release-x64/extra-type-settings
          chmod 755 release-x64/*
          tar -czf "extra-type-linux-x64.tar.gz" -C release-x64 .

          sha256sum "extra-type-linux-x64.tar.gz" > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "$TAG" \
              --draft
          fi

          gh release upload "$TAG" \
            extra-type-linux-x64.tar.gz \
            checksums.txt \
            --clobber

          IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" = "true" ]; then
            case "$VERSION" in
              *-*) gh release edit "$TAG" --draft=false --prerelease=true ;;
              *)   gh release edit "$TAG" --draft=false --prerelease=false --latest ;;
            esac
          fi
